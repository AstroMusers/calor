[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calor"
version = "0.1.0"
description = "Thermal-emission models and variable-regime inference for rocky exoplanets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "pcat", "tdpy"]

[project.optional-dependencies]
bokeh = ["bokeh>=3.0"]

[tool.setuptools.packages.find]
include = ["calor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]